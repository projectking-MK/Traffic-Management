# Render Deployment Blueprint Configuration File
# Smart Traffic Management System for Tamil Nadu

services:
  # 1. Python Flask REST Backend Service
  - type: web
    name: smart-traffic-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --chdir backend app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-traffic-db
          property: connectionString

  # 2. React Vite Client-Side SPA Frontend Service
  - type: web
    name: smart-traffic-frontend
    env: static
    buildCommand: "npm install && npm run build"
    publishPath: "dist"
    headers:
      - path: "/*"
        name: "Cache-Control"
        value: "public, max-age=31536000"
    routes:
      - type: rewrite
        from: "/api/*"
        to: "https://smart-traffic-backend.onrender.com/api/*"
      - type: rewrite
        from: "/*"
        to: "/index.html"

databases:
  # 3. Dedicated MySQL Database Instance
  - name: smart-traffic-db
    databaseName: smart_traffic
    user: admin
    plan: free
